services:
  - type: web
    name: qip-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install uv && uv sync --frozen --no-dev --no-install-project
    startCommand: uv run --no-sync uvicorn api.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: PYTHONPATH
        value: "."
      - key: QIP_PACING_SCALE
        value: 1.0
      - key: CORS_ORIGINS
        value: "*"
