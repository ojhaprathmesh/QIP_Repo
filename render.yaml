services:
  - type: web
    name: qip-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install uv && uv pip install --system -r requirements.txt
    startCommand: uvicorn api.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: QIP_PACING_SCALE
        value: 1.0
      - key: CORS_ORIGINS
        value: "*"
